/* Layout: sitio inmobiliario profesional — barra de contacto, encabezado blanco fijo, portada fotográfica a ancho completo con buscador, franja de servicios, grillas de fichas, mosaico de fotos + visor, banda para propietarios, contacto en dos columnas y pie en columnas */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --ink:#1D1D1B; --muted:#5E6067; --line:#E3E5E9;
  --dark:#1E1F22; --dark2:#2A2B2F; --on-dark:#FFFFFF; --on-dark-soft:#B9BBC1;
  --accent:#FDB200; --accent-ink:#1D1D1B; --teal:#2C766E; --soft:#ECEEF1; --danger:#B3261E; --wa:#1E8E4E;
  --band:#1E1F22; --on-band:#FFFFFF; --brass:#FDB200;
  --display:"Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Public Sans", "Segoe UI", Arial, sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(16,18,24,.06), 0 8px 24px rgba(16,18,24,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--dark)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);line-height:1.12;text-wrap:balance;margin:0;color:inherit}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.kicker{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:28px;height:3px;background:var(--accent);flex:none}
.kicker.light{color:#FFFFFF}
.note{font-size:13px;color:var(--muted)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:13px 22px;font-family:var(--display);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;background:var(--accent);color:var(--accent-ink);transition:filter .2s,transform .2s}
.btn:hover{filter:brightness(1.04);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.dark{background:var(--dark);color:#fff}
.btn.brass{background:var(--accent);color:var(--accent-ink)}
.btn.wa{background:var(--wa);color:#fff}
.btn.full{width:100%}
.btn.big{padding:16px 26px;font-size:16px}
.btn.small{padding:7px 14px;font-size:13px}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.linkbtn{border:0;background:none;color:var(--teal);font-weight:700;cursor:pointer;text-decoration:underline;padding:0}
select,input,textarea{background:var(--surface);border:1px solid #D3D6DC;border-radius:10px;padding:11px 13px;font-size:15px;min-width:0;width:100%}
select:focus,input:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(253,178,0,.35)}
textarea{resize:vertical}

/* Barra superior */
.util{background:var(--dark);color:var(--on-dark-soft);font-size:13px}
.util .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:8px;flex-wrap:wrap}
.util-l,.util-r{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.u-item{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--on-dark-soft)}
.u-item svg{color:var(--accent)}
a.u-item:hover{color:#fff}
.u-tag{letter-spacing:.08em}
.u-soc{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.08);color:#fff}
.u-soc:hover{background:var(--accent);color:var(--accent-ink)}
@media (max-width:700px){.u-tag{display:none}.util-l .u-item:not(:first-child){display:none}}

/* Encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.97);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;padding-block:14px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.logo-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:var(--dark);color:#fff;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em}
.logo-mark i{font-style:normal;color:var(--accent)}
.logo-txt{font-family:var(--display);font-size:20px;font-weight:500;letter-spacing:.01em}
.logo-txt b{font-weight:700}
.logo.light{color:#fff}
.logo.light .logo-mark{background:var(--accent);color:var(--accent-ink)}
.logo.light .logo-mark i{color:#fff}
.nav{display:flex;align-items:center;gap:28px;margin-left:auto;font-family:var(--display);font-size:15px;font-weight:500}
.nav a{text-decoration:none;color:var(--ink);position:relative;padding-block:6px}
.nav a:not(.nav-cta)::after{content:"";position:absolute;left:0;right:100%;bottom:0;height:2px;background:var(--accent);transition:right .25s}
.nav a:not(.nav-cta):hover::after{right:0}
.nav-cta{background:var(--accent);color:var(--accent-ink)!important;border-radius:10px;padding:10px 18px!important;font-weight:600}
.menu-btn{display:none;margin-left:auto;align-items:center;gap:4px;flex-direction:column;justify-content:center;background:transparent;border:1px solid var(--line);border-radius:10px;width:46px;height:44px;cursor:pointer;padding:0}
.menu-btn span{display:block;width:20px;height:2px;background:var(--ink);border-radius:2px}
.menu-btn b{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:1000px){
  .menu-btn{display:flex}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;align-items:stretch;gap:0;background:#fff;padding:6px max(20px,env(safe-area-inset-right,0px)) 18px max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);box-shadow:0 12px 24px rgba(0,0,0,.08)}
  .nav.open{display:flex}
  .nav a{padding:14px 0;border-bottom:1px solid var(--line);font-size:17px}
  .nav a::after{display:none}
  .nav-cta{margin-top:14px;text-align:center;border-bottom:0!important}
  .top .wrap{position:relative}
}
section[id]{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 80px)}

/* Portada */
.hero{position:relative;background:var(--dark);color:#fff;overflow:hidden}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,15,18,.82) 0%,rgba(14,15,18,.55) 45%,rgba(14,15,18,.15) 100%),linear-gradient(0deg,rgba(14,15,18,.55),rgba(14,15,18,0) 40%)}
.hero-in{position:relative;display:grid;gap:36px;padding-block:96px 56px}
.hero-copy{display:grid;gap:18px;max-width:680px;min-width:0}
.hero h1{font-weight:600;font-size:clamp(34px,5vw,60px);letter-spacing:-.01em;line-height:1.06;overflow-wrap:break-word;hyphens:auto}
.hero p{font-size:18px;color:#E4E5E8;max-width:54ch}
.search{background:#fff;color:var(--ink);border-radius:var(--r);box-shadow:0 20px 50px rgba(0,0,0,.3);max-width:980px;overflow:hidden}
.s-tabs{display:flex;border-bottom:1px solid var(--line)}
.s-tabs button{border:0;background:transparent;padding:14px 26px;font-family:var(--display);font-weight:600;font-size:15px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.s-tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.s-fields{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;padding:18px;align-items:end}
.s-fields label{display:grid;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--display);min-width:0}
.s-go{height:47px}
@media (max-width:720px){.s-fields{grid-template-columns:1fr}.hero-in{padding-block:64px 40px}.hero p{font-size:16px}}

/* Franja de servicios */
.facts{background:var(--dark);color:#fff;border-bottom:4px solid var(--accent)}
.facts .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.fact{display:flex;gap:14px;align-items:center;padding:22px 18px;border-left:1px solid rgba(255,255,255,.08)}
.fact:first-child{border-left:0;padding-left:0}
.fact svg{flex:none;color:var(--accent);width:26px;height:26px}
.fact strong{display:block;font-family:var(--display);font-size:16px;font-weight:600;line-height:1.25}
.fact small{display:block;font-size:13px;color:var(--on-dark-soft)}
@media (max-width:860px){.facts .wrap{grid-template-columns:1fr 1fr}.fact{border-left:0;padding-left:0}}
@media (max-width:440px){.facts .wrap{grid-template-columns:1fr}.fact{padding-block:14px}}

/* Secciones */
.section{padding-block:80px}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px 24px;margin-bottom:36px}
.sec-head > div:first-child{display:grid;gap:12px}
.sec-head h2{font-weight:600;font-size:clamp(30px,3.6vw,44px);letter-spacing:-.01em}
.sec-head.center{justify-content:center;text-align:center}
.sec-head.center .kicker{justify-content:center}
.sec-side{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.count{font-family:var(--display);font-weight:600;color:var(--muted);font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--dark);color:#fff;border-radius:999px;padding:5px 6px 5px 14px;font-size:13px;font-weight:600}
.chip button{border:0;background:rgba(255,255,255,.15);color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;line-height:1}

/* Fichas */
.lista{background:var(--bg)}
.lista.alt{background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:28px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;text-decoration:none;color:inherit;min-width:0;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);transition:box-shadow .25s ease,transform .25s ease}
.lista.alt .card{background:var(--surface)}
.card:hover{box-shadow:0 18px 40px rgba(16,18,24,.14);transform:translateY(-4px)}
.card .ph{position:relative;aspect-ratio:3/2;overflow:hidden;background:var(--soft);max-width:100%}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease}
.card:hover .ph img{transform:scale(1.05)}
.card .ph::after{content:"";position:absolute;inset:auto 0 0;height:40%;background:linear-gradient(0deg,rgba(0,0,0,.45),transparent);pointer-events:none}
.tags{position:absolute;top:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap;z-index:1}
.tag{display:inline-block;background:#FFFFFF;color:#1D1D1B;font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:6px}
.tag.op{background:#FDB200;color:#1D1D1B}
.tag.st{background:#1D1D1B;color:#FFFFFF}
.tag.ex{background:#FFF3D6;color:#6A4B12}
.tag.code{background:#1D1D1B;color:#FDB200}
.cod{position:absolute;right:14px;top:14px;z-index:1;background:rgba(20,21,24,.85);color:#FDB200;font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.1em;padding:5px 10px;border-radius:6px}
.nfotos{position:absolute;right:14px;bottom:12px;z-index:1;display:inline-flex;align-items:center;gap:5px;color:#fff;font-size:13px;font-weight:600}
.card .body{padding:20px 22px 0;display:grid;gap:6px;flex:1}
.card .price{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em}
.card .clp{font-size:14px;color:var(--muted);margin-top:-4px}
.p-price .clp-p{font-size:15px;color:var(--ink);font-weight:600}
.card .price small{font-weight:500;color:var(--muted);font-size:14px}
.card h3{font-size:19px;font-weight:600;line-height:1.3}
.card .loc{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.card .loc svg{width:16px;height:16px;color:var(--teal);flex:none}
.specs{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:13px;margin-top:10px;padding-block:14px;border-top:1px solid var(--line)}
.specs span{display:inline-flex;align-items:center;gap:6px}
.specs b{color:var(--ink);font-weight:700}
.specs svg{color:var(--teal);width:18px;height:18px}
.card-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin:0 -22px;padding:14px 22px;font-size:13px;color:var(--muted);background:#FAFBFC;margin-top:auto}
.card .ver{font-family:var(--display);font-size:14px;font-weight:600;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.card:hover .ver svg{transform:translateX(3px)}
.card .ver svg{transition:transform .2s}
.card.out{opacity:.6}
.empty{background:var(--surface);border:1px dashed #CDD1D7;border-radius:var(--r);padding:48px 20px;text-align:center;color:var(--muted)}

/* Servicios */
.servicios{background:var(--bg)}
.serv-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.serv{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:30px 26px;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s}
.serv:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(16,18,24,.12)}
.ico{width:52px;height:52px;border-radius:12px;background:#FFF4D6;color:#8A6100;display:grid;place-items:center;margin-bottom:6px}
.ico svg{width:26px;height:26px}
.serv h3{font-size:21px;font-weight:600}
.serv p{font-size:14.5px;color:var(--muted);flex:1}
.serv-link{font-family:var(--display);font-weight:600;font-size:14px;color:var(--teal);text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-top:6px}
@media (max-width:1000px){.serv-grid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.serv-grid{grid-template-columns:1fr}}

/* Historia */
.historia{background:var(--surface)}
.hist-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:64px;align-items:center}
.hist-copy{display:grid;gap:18px}
.hist-copy h2{font-weight:600;font-size:clamp(28px,3.4vw,42px);letter-spacing:-.01em}
.hist-copy .desc{white-space:pre-line;color:var(--muted);font-size:16.5px;line-height:1.75}
.hist-media{position:relative;border-radius:var(--r);overflow:visible}
.hist-media img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r);display:block;max-width:100%}
.hist-card{position:absolute;left:-28px;bottom:28px;background:var(--dark);color:#fff;border-radius:var(--r);padding:22px 26px;box-shadow:0 20px 40px rgba(0,0,0,.25);border-left:4px solid var(--accent)}
.hist-card b{font-family:var(--display);font-size:18px}
.hist-card ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px;font-size:14px;color:var(--on-dark-soft)}
.hist-card li::before{content:"✓";color:var(--accent);font-weight:700;margin-right:8px}
@media (max-width:900px){.hist-grid{grid-template-columns:1fr;gap:36px}.hist-media img{aspect-ratio:16/10}.hist-card{left:16px;bottom:16px}}

/* Banda propietarios */
.owner{background:var(--accent);color:var(--accent-ink)}
.owner-in{display:flex;align-items:center;justify-content:space-between;gap:24px 40px;padding-block:52px;flex-wrap:wrap}
.owner-in > div{display:grid;gap:10px;max-width:640px}
.owner h2{font-weight:600;font-size:clamp(26px,3vw,36px)}
.owner p{font-size:16.5px}

/* Contacto */
.contacto{background:var(--dark);color:#fff}
.contact-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:start}
.c-info{display:grid;gap:18px}
.c-info h2{font-weight:600;font-size:clamp(30px,3.6vw,44px)}
.c-info > p{color:var(--on-dark-soft);font-size:16px}
.c-lines{display:grid;gap:10px;margin-top:6px}
.contacto .line-item{background:var(--dark2);border-color:transparent}
.contacto .line-item small{color:var(--on-dark-soft)}
.c-form{background:#fff;color:var(--ink);border-radius:var(--r);padding:30px;display:grid;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.c-form h3{font-size:24px;font-weight:600}
.c-form label,.panel label{display:grid;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--display)}
@media (max-width:860px){.contact-grid{grid-template-columns:1fr;gap:36px}}
.line-item{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.li-ico{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);flex:none}
.li-ico svg{width:18px;height:18px}
.line-item > div{display:grid;min-width:0}
.line-item small{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;font-family:var(--display)}
.line-item .val{font-weight:600;user-select:all;overflow-wrap:anywhere;min-width:0}
.copy{margin-left:auto;border:0;background:rgba(253,178,0,.18);color:inherit;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--display)}

/* Pie */
footer{background:#141518;color:var(--on-dark-soft);font-size:14px}
.foot-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;gap:36px;padding-block:60px 44px}
.foot-grid > div{display:grid;gap:10px;align-content:start}
.foot-grid h4{color:#fff;font-size:15px;font-weight:600;margin-bottom:4px}
.foot-grid a{text-decoration:none}
.foot-grid a:hover{color:#fff}
.f-brand p{max-width:34ch;margin-top:6px}
.f-soc{display:flex;gap:10px;margin-top:6px}
.f-soc a{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);color:#fff}
.f-soc a:hover{background:var(--accent);color:var(--accent-ink)}
.foot-bar{border-top:1px solid rgba(255,255,255,.08)}
